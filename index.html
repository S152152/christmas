<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#05070c" />
<title>M Christmas Tree 2026 · 五台 M 的圣诞树</title>
<style>
  :root{
    --accent:#2cff72;
    --accent-soft:rgba(44,255,114,.35);
    --ink:#f3f7ff;
    --dim:#8fa3c0;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:#05070c;overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .glow-bg{
    position:fixed;inset:0;pointer-events:none;
    background:
      radial-gradient(60% 45% at 50% 12%, rgba(255,255,255,.05), transparent 70%),
      radial-gradient(50% 40% at 50% 92%, rgba(0,0,0,.55), transparent 70%),
      radial-gradient(120% 90% at 50% 50%, transparent 55%, rgba(0,0,0,.65) 100%);
  }
  /* ---- 顶部文案 ---- */
  .hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
  .top{padding:clamp(18px,5vh,46px) 18px 0;text-align:center}
  .top h1{
    margin:0;font-weight:600;letter-spacing:.28em;
    font-size:clamp(16px,3vw,32px);
    text-shadow:0 0 18px var(--accent-soft),0 0 52px rgba(255,255,255,.12);
  }
  .top .sub{
    margin-top:.9em;font-size:clamp(9px,1.2vw,12px);letter-spacing:.44em;
    color:var(--dim);text-transform:uppercase;
  }
  .bottom{padding:0 18px clamp(16px,4vh,38px);text-align:center}
  .tip{font-size:clamp(11px,1.6vw,13px);color:#a9bbd6;letter-spacing:.08em}
  .brand{
    margin-top:8px;font-size:clamp(9px,1.1vw,11px);letter-spacing:.3em;
    color:#5d6f8c;text-transform:uppercase;
  }
  /* ---- 挂饰 ---- */
  .ornaments{position:fixed;inset:0;pointer-events:none}
  .orn{
    position:absolute;pointer-events:auto;border:0;padding:0;background:none;
    width:var(--s,72px);height:var(--s,72px);
    transform:translate(-50%,-50%);
    cursor:pointer;
    transition:filter .25s ease;
    animation:bob var(--dur,6s) ease-in-out infinite alternate;
    animation-delay:var(--delay,0s);
    will-change:transform;
  }
  .orn.in{animation:bob var(--dur,6s) ease-in-out infinite alternate, intro .9s cubic-bezier(.2,.8,.2,1) both}
  @keyframes intro{from{opacity:0;transform:translate(-50%,-50%) scale(.4)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
  @keyframes bob{from{transform:translate(-50%,-52%) rotate(-3deg)}to{transform:translate(-50%,-48%) rotate(3deg)}}
  .orn img{
    width:100%;height:100%;object-fit:cover;object-position:50% 62%;border-radius:50%;display:block;
    border:2px solid rgba(255,255,255,.18);
    box-shadow:0 0 0 1px rgba(0,0,0,.5),0 10px 26px rgba(0,0,0,.55),
               0 0 22px var(--ring, rgba(44,255,114,.5)), inset 0 0 14px rgba(0,0,0,.35);
    filter:saturate(1.06) contrast(1.04) brightness(1.38);
  }
  .orn:hover{filter:brightness(1.24)}
  .orn:active{transform:translate(-50%,-50%) scale(.94)}
  .orn .cap{
    position:absolute;left:50%;bottom:-1.25em;transform:translateX(-50%);
    font-size:10px;letter-spacing:.12em;color:#9fb2cd;white-space:nowrap;
    opacity:0;transition:opacity .2s ease;
  }
  .orn:hover .cap{opacity:1}
  /* ---- 灯箱 ---- */
  .viewer{
    position:fixed;inset:0;display:none;place-items:center;
    background:rgba(3,5,9,.82);backdrop-filter:blur(14px);
    z-index:20;padding:24px;
  }
  .viewer.on{display:grid}
  .viewer .card{
    max-width:min(92vw,560px);width:100%;
    background:linear-gradient(180deg,#0d1420,#070a10);
    border:1px solid rgba(255,255,255,.09);border-radius:20px;
    padding:14px;box-shadow:0 30px 80px rgba(0,0,0,.7),0 0 40px var(--ring,rgba(44,255,114,.35));
    animation:pop .32s cubic-bezier(.2,.9,.2,1) both;
  }
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .viewer img{width:100%;border-radius:14px;display:block;max-height:64vh;object-fit:cover}
  .viewer .meta{display:flex;justify-content:space-between;align-items:baseline;margin-top:12px;gap:12px}
  .viewer .meta strong{font-size:14px;letter-spacing:.06em}
  .viewer .meta span{font-size:11px;color:var(--dim);letter-spacing:.1em}
  .viewer .close{
    margin-top:12px;width:100%;padding:11px 0;border-radius:12px;cursor:pointer;
    border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);
    color:var(--ink);font-size:13px;letter-spacing:.24em;
  }
  .viewer .close:active{background:rgba(255,255,255,.12)}
  @media (max-width:520px){ .orn .cap{display:none} }
  @media (prefers-reduced-motion:reduce){ .orn.in,.orn{animation:none} }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="glow-bg"></div>

<div class="hud">
  <div class="top">
    <h1>MERRY CHRISTMAS</h1>
    <div class="sub">2 0 2 6 &nbsp;·&nbsp; M POWER 圣 诞 树</div>
  </div>
  <div class="bottom">
    <div class="tip" id="tip">点树上的车，换一种灯色</div>
    <div class="brand">christmas-tree &nbsp;·&nbsp; M edition v18</div>
  </div>
</div>

<div class="ornaments" id="ornaments"></div>

<div class="viewer" id="viewer">
  <div>
    <div class="card" id="card">
      <img id="bigImg" alt="" />
      <div class="meta"><strong id="bigTitle"></strong><span id="bigSub"></span></div>
      <button class="close" id="closeBtn">关 闭</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var CARS = [
    {src:"car-green.jpg",  accent:"#2cff72", name:"绿灯 M",   sub:"GREEN DRL · CARBON"},
    {src:"car-yellow.jpg", accent:"#ffd52e", name:"黄灯 M",   sub:"YELLOW DRL · CARBON"},
    {src:"car-blue.jpg",   accent:"#3ea8ff", name:"蓝灯 M",   sub:"BLUE DRL · CARBON"},
    {src:"car-white.jpg",  accent:"#eaf2ff", name:"白灯 M",   sub:"WHITE DRL · CARBON"},
    {src:"car-blue2.jpg",  accent:"#59b8ff", name:"蓝灯 M Ⅱ", sub:"BLUE DRL · CARBON"}
  ];

  var canvas = document.getElementById("scene");
  var ctx = canvas.getContext("2d");
  var ornLayer = document.getElementById("ornaments");
  var tipEl = document.getElementById("tip");
  var view = document.getElementById("viewer");
  var bigImg = document.getElementById("bigImg");
  var bigTitle = document.getElementById("bigTitle");
  var bigSub = document.getElementById("bigSub");
  var card = document.getElementById("card");

  var W = 0, H = 0, DPR = 1;
  var cx = 0, apexY = 0, baseY = 0, baseR = 0;
  var theme = {r:44,g:255,b:114};
  var target = {r:44,g:255,b:114};
  var lit = 0;          // 0..1 点亮程度
  var litTarget = 0.60;

  /* ---------- 树体粒子 ---------- */
  var tree = [];
  var garland = [];
  var N = 0;
  function buildTree(){
    tree.length = 0;
    var w = window.innerWidth, h = window.innerHeight;
    cx = w * 0.5;
    var portrait = h > w * 1.15;
    var treeH = Math.min(h * (portrait ? 0.52 : 0.60), w * (portrait ? 0.95 : 0.92));
    baseY = h * (portrait ? 0.775 : 0.845);
    apexY = baseY - treeH;
    baseR = Math.min(w * (portrait ? 0.42 : 0.30), treeH * (portrait ? 0.62 : 0.50));
    N = Math.round(Math.min(6500, Math.max(2200, w * h / 240)));
    for (var i=0;i<N;i++){
      var t = Math.pow(Math.random(), 0.55);           // 0 底部 → 1 顶部
      var y = baseY - t * treeH;
      var r = baseR * (1 - t);
      var ang = Math.random() * Math.PI * 2;
      var rr = r * (0.52 + Math.random() * 0.48);
      var depth = Math.cos(ang);                        // 1 = 最前
      tree.push({
        x: cx + Math.sin(ang) * rr,
        y: y + (Math.random()-0.5) * 6,
        z: 0.45 + 0.55 * (0.5 + 0.5*depth),
        s: 0.55 + Math.random()*1.25,
        ph: Math.random() * Math.PI * 2,
        sp: 0.6 + Math.random() * 1.6,
        light: Math.random() < 0.15
      });
    }
    // 螺旋彩灯：让树有清晰的轮廓线
    garland.length = 0;
    var turns = 7, per = 46;
    for (var g=0; g<turns*per; g++){
      var tg = g / (turns*per);
      var angG = tg * turns * Math.PI * 2;
      var rG = baseR * (1 - tg) * 0.99;
      garland.push({
        x: cx + Math.sin(angG) * rG,
        y: baseY - tg * treeH,
        ph: Math.random() * Math.PI * 2,
        sp: 1.2 + Math.random() * 1.4,
        k: 0.9
      });
    }
  }

  /* ---------- 星空 & 雪 ---------- */
  var stars = [], snow = [];
  function buildAmbient(){
    stars.length = 0; snow.length = 0;
    var nStars = Math.round((window.innerWidth*window.innerHeight)/9000);
    for (var i=0;i<nStars;i++){
      stars.push({x:Math.random()*window.innerWidth, y:Math.random()*window.innerHeight*0.75,
        r:Math.random()*1.3+0.2, p:Math.random()*Math.PI*2, sp:Math.random()*1.2+0.3});
    }
    var nSnow = Math.round(window.innerWidth/14);
    for (var j=0;j<nSnow;j++){
      snow.push({x:Math.random()*window.innerWidth, y:Math.random()*window.innerHeight,
        r:Math.random()*1.8+0.5, v:Math.random()*0.7+0.25, d:Math.random()*Math.PI*2});
    }
  }

  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
    buildTree(); buildAmbient(); placeOrnaments();
  }

  /* ---------- 挂饰定位 ---------- */
  var ornEls = [];
  function placeOrnaments(){
    ornLayer.innerHTML = "";
    ornEls.length = 0;
    var treeH = baseY - apexY;
    var slots = [
      {t:0.17, ang: Math.PI/2 - 0.55},
      {t:0.30, ang: Math.PI/2 + 0.62},
      {t:0.43, ang: Math.PI/2 - 0.72},
      {t:0.56, ang: Math.PI/2 + 0.55},
      {t:0.69, ang: Math.PI/2 - 0.42}
    ];
    CARS.forEach(function(car, i){
      var slot = slots[i % slots.length];
      var r = baseR * (1 - slot.t);
      var x = cx + Math.cos(slot.ang) * r * 0.85;
      var y = baseY - slot.t * treeH;
      var size = Math.max(44, Math.min(102, r * 0.38));
      var el = document.createElement("button");
      el.className = "orn in";
      el.setAttribute("aria-label", car.name);
      el.style.setProperty("--s", size.toFixed(0) + "px");
      el.style.setProperty("--ring", "rgba(" + hexToRgb(car.accent) + ",.55)");
      el.style.setProperty("--dur", (5.4 + i * 0.7).toFixed(2) + "s");
      el.style.setProperty("--delay", (-i * 1.1).toFixed(2) + "s");
      el.style.left = x + "px";
      el.style.top = y + "px";
      el.style.zIndex = String(100 + Math.round(size));
      el.innerHTML = '<img src="' + car.src + '" alt="' + car.name + '"><span class="cap">' + car.name + '</span>';
      el.addEventListener("click", function(ev){
        ev.stopPropagation();
        openCar(car);
      });
      ornLayer.appendChild(el);
      ornEls.push(el);
    });
  }

  function hexToRgb(h){
    var v = h.replace("#","");
    return [parseInt(v.slice(0,2),16), parseInt(v.slice(2,4),16), parseInt(v.slice(4,6),16)].join(",");
  }

  function openCar(car){
    bigImg.src = car.src;
    bigTitle.textContent = car.name;
    bigSub.textContent = car.sub;
    card.style.setProperty("--ring", "rgba(" + hexToRgb(car.accent) + ",.45)");
    view.classList.add("on");
    setTheme(car.accent);
  }

  function setTheme(hex){
    var rgb = hexToRgb(hex).split(",").map(Number);
    target.r = rgb[0]; target.g = rgb[1]; target.b = rgb[2];
    document.documentElement.style.setProperty("--accent", hex);
    document.documentElement.style.setProperty("--accent-soft", "rgba(" + rgb.join(",") + ",.35)");
    litTarget = 1;
    tipEl.textContent = "灯已点亮 · 再点车换色";
  }

  document.getElementById("closeBtn").addEventListener("click", function(e){
    e.stopPropagation(); view.classList.remove("on");
  });
  view.addEventListener("click", function(){ view.classList.remove("on"); });

  /* ---------- 绘制 ---------- */
  var t0 = 0;
  function frame(ts){
    if (!t0) t0 = ts;
    var time = (ts - t0) / 1000;

    theme.r += (target.r - theme.r) * 0.08;
    theme.g += (target.g - theme.g) * 0.08;
    theme.b += (target.b - theme.b) * 0.08;
    lit += (litTarget - lit) * 0.05;

    ctx.clearRect(0,0,W,H);

    // 星空
    for (var i=0;i<stars.length;i++){
      var st = stars[i];
      var a = 0.25 + 0.55 * (0.5 + 0.5*Math.sin(time*st.sp + st.p));
      ctx.globalAlpha = a;
      ctx.fillStyle = "#cfe0ff";
      ctx.beginPath(); ctx.arc(st.x, st.y, st.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    // 地面反光
    var g = ctx.createRadialGradient(cx, baseY+6, 4, cx, baseY+6, baseR*2.1);
    g.addColorStop(0, "rgba(" + Math.round(theme.r) + "," + Math.round(theme.g) + "," + Math.round(theme.b) + "," + (0.22*lit) + ")");
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.ellipse(cx, baseY+8, baseR*2.1, baseR*0.6, 0, 0, Math.PI*2); ctx.fill();

    // 树干光晕
    var halo = ctx.createRadialGradient(cx, (apexY+baseY)/2, 10, cx, (apexY+baseY)/2, baseR*1.9);
    halo.addColorStop(0, "rgba(" + Math.round(theme.r) + "," + Math.round(theme.g) + "," + Math.round(theme.b) + "," + (0.30*lit) + ")");
    halo.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = halo;
    ctx.fillRect(0,0,W,H);

    // 顶星
    var starPulse = 0.55 + 0.45 * Math.sin(time * 2.2);
    var starR = Math.max(12, Math.min(30, baseR * 0.11));
    var sg = ctx.createRadialGradient(cx, apexY - starR*0.3, 0, cx, apexY - starR*0.3, starR*2.6);
    sg.addColorStop(0, "rgba(255,255,235," + (0.85 * (0.5 + 0.5*lit)) + ")");
    sg.addColorStop(0.35, "rgba(255,226,150," + (0.42*starPulse) + ")");
    sg.addColorStop(1, "rgba(255,180,60,0)");
    ctx.fillStyle = sg;
    ctx.beginPath(); ctx.arc(cx, apexY - starR*0.3, starR*2.6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "rgba(255,252,240," + (0.9*starPulse) + ")";
    ctx.beginPath(); ctx.arc(cx, apexY - starR*0.3, starR*0.22, 0, Math.PI*2); ctx.fill();
    // 星芒
    ctx.save();
    ctx.translate(cx, apexY - starR*0.3);
    ctx.globalAlpha = 0.55 + 0.45*starPulse;
    for (var sp2=0; sp2<8; sp2++){
      var ang2 = sp2 * Math.PI/4 + time*0.05;
      var len = starR * (sp2 % 2 === 0 ? 2.4 : 1.15);
      ctx.strokeStyle = "rgba(255,248,225,0.55)";
      ctx.lineWidth = Math.max(1, starR*0.03);
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(Math.cos(ang2)*len, Math.sin(ang2)*len);
      ctx.stroke();
    }
    ctx.restore();
    ctx.globalAlpha = 1;

    // 锥体底色，让轮廓更实
    var cone = ctx.createLinearGradient(cx, apexY, cx, baseY);
    cone.addColorStop(0, "rgba(" + Math.round(theme.r) + "," + Math.round(theme.g) + "," + Math.round(theme.b) + "," + (0.10*lit) + ")");
    cone.addColorStop(0.55, "rgba(" + Math.round(theme.r) + "," + Math.round(theme.g) + "," + Math.round(theme.b) + "," + (0.14*lit) + ")");
    cone.addColorStop(1, "rgba(30,70,55,0)");
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(cx, apexY);
    ctx.lineTo(cx - baseR, baseY);
    ctx.lineTo(cx + baseR, baseY);
    ctx.closePath();
    ctx.fillStyle = cone;
    ctx.fill();
    ctx.restore();

    // 树体
    ctx.globalCompositeOperation = "lighter";
    for (var k=0;k<tree.length;k++){
      var p = tree[k];
      var tw = p.light ? (0.45 + 0.55*Math.abs(Math.sin(time*p.sp + p.ph))) : (0.30 + 0.20*Math.sin(time*0.9 + p.ph));
      var rr2 = p.s * (0.9 + 0.35*lit);
      if (p.light){
        ctx.fillStyle = "rgba(" + Math.round(theme.r) + "," + Math.round(theme.g) + "," + Math.round(theme.b) + "," + (0.30 + 0.55*tw) * p.z + ")";
      } else {
        ctx.fillStyle = "rgba(176,226,196," + (0.18 + 0.32*tw) * p.z + ")";
      }
      ctx.beginPath(); ctx.arc(p.x, p.y, rr2, 0, Math.PI*2); ctx.fill();
    }
    // 螺旋彩灯
    for (var q=0;q<garland.length;q++){
      var gp = garland[q];
      var gtw = 0.5 + 0.5*Math.sin(time*2.4 + gp.ph);
      var gr = 1.7 + 2.6*gtw;
      var gg = ctx.createRadialGradient(gp.x, gp.y, 0, gp.x, gp.y, gr*3.2);
      gg.addColorStop(0, "rgba(" + Math.round(255) + ",244,214," + (0.85*gtw*lit) + ")");
      gg.addColorStop(0.4, "rgba(" + Math.round(theme.r) + "," + Math.round(theme.g) + "," + Math.round(theme.b) + "," + (0.40*gtw*lit) + ")");
      gg.addColorStop(1, "rgba(0,0,0,0)");
      ctx.fillStyle = gg;
      ctx.beginPath(); ctx.arc(gp.x, gp.y, gr*3.2, 0, Math.PI*2); ctx.fill();
    }

    ctx.globalCompositeOperation = "source-over";

    // 雪
    for (var s=0;s<snow.length;s++){
      var f = snow[s];
      f.y += f.v;
      f.x += Math.sin(time*0.6 + f.d) * 0.6;
      if (f.y > H + 6){ f.y = -6; f.x = Math.random()*W; }
      ctx.globalAlpha = 0.42;
      ctx.fillStyle = "#e8f2ff";
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    requestAnimationFrame(frame);
  }

  /* ---------- 交互：点亮 ---------- */
  function lightUp(){
    litTarget = 1;
    if (tipEl.textContent.indexOf("点亮") >= 0) tipEl.textContent = "已点亮 · 点车换灯色";
  }
  window.addEventListener("pointerdown", function(e){
    if (e.target.closest(".orn") || e.target.closest(".viewer")) return;
    lightUp();
  });

  window.addEventListener("resize", resize);
  window.addEventListener("orientationchange", function(){ setTimeout(resize, 180); });

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
