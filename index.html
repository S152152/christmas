<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffc9da" />
<title>Bava · Merry Christmas 2026 · Hollywood × Disneyland</title>
<style>
  :root{
  --pink:#ff9dc2; --gold:#ffdf6b; --gold-soft:rgba(255,214,150,.32);
  --ink:#fff4f8; --dim:#ffd8e6;
  --bg:#ffc9da;
  --title:#fff6fa;
  --title-shadow:0 0 18px rgba(255,150,200,.55),0 2px 26px rgba(120,8,52,.55);
  --sub:#ffd3e4;
  --line:rgba(255,224,120,.7);
  --tip:#ffe1ec;
  --tip-shadow:0 1px 12px rgba(90,6,40,.8);
  --tip-b:#ffe45c;
  --brand:#e7a9c6;
  --vig:rgba(112,8,54,.55);
  --btn-border:rgba(255,226,150,.55);
  --btn-bg:rgba(122,10,55,.42);
  --btn-fg:#fff0f6;
}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none;
  }
  #scene{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
  .vignette{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(120% 92% at 50% 44%, transparent 46%, var(--vig) 100%);}
  .hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between}
  .top{padding:clamp(16px,4.4vh,42px) 16px 0;text-align:center}
  .top h1{
    margin:0;font-weight:600;letter-spacing:.11em;
    font-size:clamp(17px,3.1vw,33px);
    color:var(--title);
    text-shadow:var(--title-shadow);
  }
  .top .sub{margin-top:.85em;font-size:clamp(9px,1.15vw,12px);letter-spacing:.38em;color:var(--sub);text-transform:uppercase}
  .top .line{margin:10px auto 0;width:min(320px,52vw);height:1px;
    background:linear-gradient(90deg,transparent,var(--line),transparent)}
  .bottom{padding:0 16px clamp(16px,4vh,34px);text-align:center}
  .tip{font-size:clamp(11px,1.5vw,13px);color:var(--tip);letter-spacing:.06em;text-shadow:var(--tip-shadow)}
  .tip b{color:var(--tip-b);font-weight:600}
  .snd{position:fixed;top:18px;right:18px;z-index:9;pointer-events:auto;cursor:pointer;
      display:flex;align-items:center;gap:8px;padding:7px 13px;border-radius:999px;
      border:1px solid var(--btn-border);background:var(--btn-bg);
      color:var(--btn-fg);font-size:12px;letter-spacing:.12em;backdrop-filter:blur(6px);
      transition:border-color .25s,box-shadow .25s,color .25s}
  body.theme-classic{
    --bg:#060a14; --title:#fff8ec; --title-shadow:0 0 18px rgba(255,200,120,.45),0 2px 26px rgba(0,0,0,.7);
    --sub:#d8c8b0; --line:rgba(255,208,138,.55); --tip:#efe3cf; --tip-shadow:0 1px 12px rgba(0,0,0,.85);
    --tip-b:#ffd08a; --brand:#8fa3c0; --vig:rgba(0,0,0,.66);
    --btn-border:rgba(255,214,160,.45); --btn-bg:rgba(12,16,28,.55); --btn-fg:#f2e3c9;
  }
  body.theme-ice{
    --bg:#dff3ff; --title:#ffffff; --title-shadow:0 0 18px rgba(150,220,255,.6),0 2px 26px rgba(8,50,80,.55);
    --sub:#d6f2ff; --line:rgba(200,240,255,.7); --tip:#f2fbff; --tip-shadow:0 1px 12px rgba(6,40,64,.75);
    --tip-b:#fff08a; --brand:#a6d8ee; --vig:rgba(8,52,84,.5);
    --btn-border:rgba(200,240,255,.6); --btn-bg:rgba(12,54,86,.45); --btn-fg:#eafaff;
  }
  .theme{position:fixed;left:18px;top:18px;z-index:9;pointer-events:auto;cursor:pointer;
      display:flex;align-items:center;gap:9px;padding:7px 13px;border-radius:999px;
      border:1px solid var(--btn-border);background:var(--btn-bg);color:var(--btn-fg);
      font-size:12px;letter-spacing:.12em;backdrop-filter:blur(6px);transition:box-shadow .25s,border-color .25s}
  .theme:hover{box-shadow:0 0 18px rgba(255,255,255,.28)}
  .theme .sw{width:12px;height:12px;border-radius:50%;box-shadow:0 0 8px currentColor}
  @media (max-width:700px){
    .theme{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);left:14px;padding:6px 11px;font-size:11px}

    .snd{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 78px);right:14px;padding:6px 11px;font-size:11px}
  }
  .snd:hover{border-color:rgba(255,240,180,.95);box-shadow:0 0 20px rgba(255,220,140,.35)}
  .snd.on{color:#fff8d4;border-color:rgba(255,232,140,.95);box-shadow:0 0 24px rgba(255,226,120,.45)}
  .snd .eq{display:inline-flex;gap:2px;align-items:flex-end;height:11px}
  .snd .eq i{width:2px;background:currentColor;opacity:.75;border-radius:1px}
  .snd.on .eq i{animation:eq .9s ease-in-out infinite}
  .snd .eq i:nth-child(1){height:4px;animation-delay:0s}
  .snd .eq i:nth-child(2){height:11px;animation-delay:.18s}
  .snd .eq i:nth-child(3){height:7px;animation-delay:.36s}
  @keyframes eq{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1)}}
  .brand{margin-top:8px;font-size:clamp(9px,1.05vw,11px);letter-spacing:.26em;color:var(--brand);text-transform:uppercase}
  @media (max-width:520px){ .top h1{letter-spacing:.04em} .top .sub{letter-spacing:.24em} }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="vignette"></div>
<button class="snd" id="snd" aria-label="Background music">
  <span class="eq"><i></i><i></i><i></i></span><span id="sndLabel">Music</span>
</button>
<button class="theme" id="theme" aria-label="Change color theme">
  <span class="sw" id="thSw"></span><span id="thLabel">Pink</span>
</button>

<div class="hud">
  <div class="top">
    <h1>Bava Wishes You a Merry Christmas</h1>
    <div class="sub">Hollywood &nbsp;·&nbsp; Los Angeles &nbsp;·&nbsp; Disneyland &nbsp;·&nbsp; 2026</div>
    <div class="line"></div>
  </div>
  <div class="bottom">
    <div class="tip" id="tip">Tap the tree &mdash; it <b>turns into a heart</b></div>
    <div class="brand" id="brand">3D Spinning Tree &nbsp;·&nbsp; Swipe to rotate &nbsp;·&nbsp; v25</div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var canvas = document.getElementById("scene");
  var ctx = canvas.getContext("2d");
  var tipEl = document.getElementById("tip");
  var W = 0, H = 0, DPR = 1;
  var cx = 0, apexY = 0, baseY = 0, baseR = 0, treeH = 0;
  var portrait = false;

  /* ---------- 灯光精灵 ---------- */
  function glowSprite(rgb){
    var c = document.createElement("canvas");
    c.width = c.height = 64;
    var g = c.getContext("2d");
    var grd = g.createRadialGradient(32,32,0,32,32,32);
    grd.addColorStop(0, "rgba(255,255,255,1)");
    grd.addColorStop(0.22, "rgba(" + rgb + ",0.92)");
    grd.addColorStop(0.55, "rgba(" + rgb + ",0.35)");
    grd.addColorStop(1, "rgba(" + rgb + ",0)");
    g.fillStyle = grd;
    g.beginPath(); g.arc(32,32,32,0,Math.PI*2); g.fill();
    return c;
  }
  var SPR = {
    gold:  glowSprite("255,198,120"),
    warm:  glowSprite("255,238,205"),
    red:   glowSprite("255,110,100"),
    blue:  glowSprite("150,198,255"),
    green: glowSprite("120,240,180")
  };


  /* ---------- 配色主题 ---------- */
  var THEMES = [
    {
      id: "pink", label: "Pink",
      swatch: "#ff8fbb",
      sky: ["#2a0a2c","#6e1444","#c33a76","#f77fa8","#ffc9da"],
      leaf: [6,72,42], leafHi: [20,134,72],
      red: [196,22,52], redHi: [242,66,94],
      starTop: "#ffe45c", starGlow: "255,226,120", starOrn: "#ffd94a",
      halo: "255,170,210", refl: "255,200,225",
      snow: "rgba(255,250,253,0.95)",
      sparkA: [255,214,235], sparkB: [255,196,120],
      ring: "255,150,200"
    },
    {
      id: "classic", label: "Classic",
      swatch: "#3bd47f",
      sky: ["#050a18","#0a1024","#1b1330","#2b1731","#06080f"],
      leaf: [6,46,30], leafHi: [22,118,68],
      red: [200,26,46], redHi: [255,80,90],
      starTop: "#ffe066", starGlow: "255,210,110", starOrn: "#ffcf55",
      halo: "255,190,130", refl: "255,206,140",
      snow: "rgba(240,248,255,0.95)",
      sparkA: [255,232,196], sparkB: [255,198,130],
      ring: "255,214,150"
    },
    {
      id: "ice", label: "Ice",
      swatch: "#8fdcff",
      sky: ["#07203a","#0f3f62","#1f6f93","#8ed0e6","#e8f7ff"],
      leaf: [8,46,60], leafHi: [30,124,146],
      red: [146,192,220], redHi: [214,240,255],
      starTop: "#ffefa8", starGlow: "255,232,160", starOrn: "#ffe98a",
      halo: "180,225,255", refl: "200,238,255",
      snow: "rgba(255,255,255,0.95)",
      sparkA: [214,244,255], sparkB: [255,226,150],
      ring: "160,220,255"
    }
  ];
  var themeIdx = 0, TH = THEMES[0];

  /* ---------- 布局 ---------- */
  function layout(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);

    portrait = H > W * 1.15;
    treeH = Math.min(H * (portrait ? 0.52 : 0.61), W * (portrait ? 0.92 : 0.86));
    baseY = H * (portrait ? 0.785 : 0.845);
    apexY = baseY - treeH;
    baseR = Math.min(W * (portrait ? 0.38 : 0.255), treeH * (portrait ? 0.62 : 0.47));
    cx = W * 0.5;

    buildTree(); buildSky();
    startGather(performance.now(), 1600);
  }

  /* ---------- 3D 圣诞树：圆锥点云，绕竖轴旋转 ---------- */
  var foliage = [], lights = [], strand = [], starOrn = [];
  var TIERS = 11;
  var treeRot = 0;
  var TREE_SPIN = 0.42;          // 自动旋转速度（弧度/秒）
  var spinAngle = 0, spinVel = 0, pitch = 0.16;

  function tierRipple(t){
    var ph = t * Math.PI * TIERS;
    return 1 + 0.055 * Math.sin(ph) + 0.02 * Math.sin(ph * 2.3);
  }
  function radiusAt(t){ return baseR * (1 - t) * tierRipple(t); }

  function buildTree(){
    foliage.length = 0; lights.length = 0; strand.length = 0; starOrn.length = 0;

    // 针叶：绿 + 红 双色，越靠外越亮
    var NF = Math.round(Math.min(9000, Math.max(portrait ? 4200 : 3000, W * H / 128)));
    for (var i=0;i<NF;i++){
      var t = Math.pow(Math.random(), 0.6);
      var rr = radiusAt(t) * (0.52 + 0.48 * Math.pow(Math.random(), 0.55));
      foliage.push({
        t: t, r: rr,
        ang: Math.random() * Math.PI * 2,
        s: 0.8 + Math.random() * 1.6,
        red: Math.random() < 0.11,
        ph: Math.random() * Math.PI * 2,
        snow: Math.random() < 0.04
      });
    }

    // 灯泡：暖金 + 红
    var NL = Math.round(Math.min(260, Math.max(120, W * H / 7000)));
    for (var j=0;j<NL;j++){
      var tl = Math.pow(Math.random(), 0.7);
      var kindRoll = Math.random();
      lights.push({
        t: tl,
        r: radiusAt(tl) * (0.9 + Math.random() * 0.12),
        ang: Math.random() * Math.PI * 2,
        rd: 1.7 + Math.random() * 1.7,
        kind: kindRoll < 0.34 ? "gold" : kindRoll < 0.56 ? "warm" : "red",
        ph: Math.random() * Math.PI * 2,
        sp: 0.9 + Math.random() * 1.7
      });
    }

    // 红色螺旋彩带
    var turns = 8, per = 34;
    for (var k=0; k<turns*per; k++){
      var tk = k / (turns*per);
      strand.push({
        t: tk,
        r: radiusAt(tk) * 1.02,
        ang: tk * turns * Math.PI * 2,
        rd: 2.5,
        ph: Math.random() * Math.PI * 2,
        sp: 1.0 + Math.random() * 1.2
      });
    }

    // 树上的黄色五角星
    var NS = Math.round(Math.min(34, Math.max(16, W * H / 42000)));
    for (var m=0;m<NS;m++){
      var tm = 0.06 + Math.random() * 0.88;
      starOrn.push({
        t: tm,
        r: radiusAt(tm) * 0.99,
        ang: Math.random() * Math.PI * 2,
        rd: 2.6 + Math.random() * 2.4,
        ph: Math.random() * Math.PI * 2,
        sp: 0.7 + Math.random() * 1.3
      });
    }
  }

  // 3D -> 屏幕：绕 y 轴旋转 + 轻微俯视角
  function project(it){
    var a = it.ang + treeRot;
    var d = Math.cos(a);                   // 1 = 正对观众
    var sc = 0.78 + 0.22 * ((d + 1) / 2);
    return {
      x: cx + Math.sin(a) * it.r,
      y: baseY - it.t * treeH - d * it.r * 0.20,
      d: d,
      sc: sc
    };
  }

  function drawStar5(x, y, r, rot, alpha, col){
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = col;
    ctx.beginPath();
    for (var i=0;i<5;i++){
      var a1 = -Math.PI/2 + i * Math.PI*2/5;
      var a2 = a1 + Math.PI/5;
      ctx.lineTo(Math.cos(a1)*r, Math.sin(a1)*r);
      ctx.lineTo(Math.cos(a2)*r*0.44, Math.sin(a2)*r*0.44);
    }
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  /* ---------- 星空 ---------- */
  var stars = [];
  function buildSky(){
    stars.length = 0;
    buildSnow();
    var n = Math.round(W * H / 12000);
    for (var i=0;i<n;i++){
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * (portrait ? 0.52 : 0.6),
        r: Math.random() * 1.2 + 0.25,
        ph: Math.random() * Math.PI * 2,
        sp: 0.5 + Math.random() * 1.4
      });
    }
  }

  /* ---------- 状态机：gather（从天而降）/ idle（树）/ heart（爱心） ---------- */
  var phase = "gather", phaseT0 = 0, gatherDur = 1500;
  var heartProg = 0;          // 0 = 树，1 = 爱心
  var heartDir = 0;           // +1 变心，-1 回树
  var HEART_MS = 900;
  var heartCX = 0, heartCY = 0, heartUnit = 10;
  var timeNow = 0;

  function startGather(now, dur){
    phase = "gather"; phaseT0 = now; gatherDur = dur || 1500;
    heartProg = 0; heartDir = 0;
  }

  // 心形参数方程
  function heartPoint(u){
    var a = u * Math.PI * 2;
    var hx = 16 * Math.pow(Math.sin(a), 3);
    var hy = 13 * Math.cos(a) - 5 * Math.cos(2*a) - 2 * Math.cos(3*a) - Math.cos(4*a);
    return [hx, -hy];
  }

  function buildHeartTargets(){
    heartCX = cx;
    heartCY = apexY + treeH * 0.48;
    heartUnit = Math.min(baseR * 1.85 / 32, treeH * 0.64 / 30);

    function assign(list, edgeBias, jitter){
      for (var i=0;i<list.length;i++){
        var it = list[i];
        var u = Math.random();
        var pt = heartPoint(u);
        var fill = Math.random() < edgeBias ? 1 : Math.pow(Math.random(), 0.55);
        var jx = (Math.random()-0.5) * jitter;
        var jy = (Math.random()-0.5) * jitter;
        it.hx = heartCX + (pt[0] * fill + jx) * heartUnit;
        it.hy = heartCY + (pt[1] * fill * 1.02 + jy) * heartUnit;
        it.hs = 0.6 + Math.random() * 0.8;
      }
    }
    assign(foliage, 0.34, 3.2);
    assign(lights, 0.92, 1.0);
    assign(strand, 0.95, 0.8);
    assign(starOrn, 0.86, 1.4);
  }

  function toHeart(now){
    if (phase === "gather") return;
    buildHeartTargets();
    phase = "heart";
    heartDir = 1;
    for (var b=0;b<(W < 600 ? 2 : 3);b++){
      burst(heartCX + (Math.random()-0.5) * baseR * 0.9,
            heartCY + (Math.random()-0.5) * treeH * 0.5,
            W < 600 ? 26 : 40, b % 2 ? [255,120,155] : [255,205,120]);
    }
  }

  function backToTree(){
    if (phase !== "heart" || heartProg < 0.9) return;
    heartDir = -1;
  }

  function updateHeart(dt){
    if (heartDir !== 0){
      heartProg += heartDir * dt * 1000 / HEART_MS;
      if (heartProg >= 1){ heartProg = 1; heartDir = 0; }
      if (heartProg <= 0){ heartProg = 0; heartDir = 0; phase = "idle"; }
    }
  }

  /* ---------- 烟花 ---------- */
  var sparks = [];
  function burst(ox, oy, count, col){
    for (var i=0;i<count;i++){
      var a = Math.random() * Math.PI * 2;
      var v = 90 + Math.random() * 230;
      sparks.push({
        x: ox, y: oy,
        vx: Math.cos(a)*v, vy: Math.sin(a)*v - 30,
        life: 1, decay: 0.55 + Math.random()*0.6,
        col: col || (Math.random() < 0.5 ? [255,212,140] : [255,244,220]),
        size: 1 + Math.random()*2.1
      });
    }
  }

  function easeOutCubic(t){ t = Math.min(1, Math.max(0,t)); return 1 - Math.pow(1-t,3); }
  function easeInOut(t){ t = Math.min(1, Math.max(0,t)); return t < 0.5 ? 2*t*t : 1 - Math.pow(-2*t+2,2)/2; }

  /* ---------- 场景元素 ---------- */
  function drawSky(time){
    var sky = ctx.createLinearGradient(0,0,0,H);
    for (var si=0; si<TH.sky.length; si++){
      sky.addColorStop(si / (TH.sky.length - 1), TH.sky[si]);
    }
    ctx.fillStyle = sky; ctx.fillRect(0,0,W,H);

    for (var i=0;i<stars.length;i++){
      var s = stars[i];
      ctx.globalAlpha = 0.2 + 0.6 * (0.5 + 0.5*Math.sin(time*s.sp + s.ph));
      ctx.fillStyle = "#fff2f7";
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;

    var hy = baseY + 24;
    var glow = ctx.createRadialGradient(cx, hy, 8, cx, hy, Math.max(W,H)*0.72);
    glow.addColorStop(0, "rgba(" + TH.halo + ",.18)");
    glow.addColorStop(0.45, "rgba(" + TH.halo + ",.10)");
    glow.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = glow; ctx.fillRect(0,0,W,H);
  }

  // 好莱坞山 + HOLLYWOOD 招牌
  function drawHills(){
    var hy = baseY + 24;
    var mw = W * 0.46;
    var mh = Math.min(H * 0.20, mw * 0.34);
    ctx.save();
    ctx.fillStyle = "rgba(9,13,23,.94)";
    ctx.beginPath();
    ctx.moveTo(-20, hy);
    ctx.bezierCurveTo(mw*0.16, hy - mh*1.15, mw*0.34, hy - mh*1.35, mw*0.52, hy - mh*0.55);
    ctx.bezierCurveTo(mw*0.72, hy - mh*0.2, mw*0.9, hy - mh*0.05, mw+20, hy);
    ctx.lineTo(mw+20, hy+20);
    ctx.lineTo(-20, hy+20);
    ctx.closePath();
    ctx.fill();

    // 第二重山，增加层次
    ctx.fillStyle = "rgba(12,17,29,.9)";
    ctx.beginPath();
    ctx.moveTo(-20, hy);
    ctx.bezierCurveTo(mw*0.1, hy - mh*0.55, mw*0.3, hy - mh*0.9, mw*0.62, hy - mh*0.35);
    ctx.lineTo(mw*0.62, hy+20); ctx.lineTo(-20, hy+20);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    // HOLLYWOOD 字母
    var fs = Math.max(10, Math.min(24, W / 78));
    var word = "HOLLYWOOD";
    ctx.save();
    ctx.font = "700 " + fs + "px Helvetica, Arial, sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "middle";
    try { ctx.letterSpacing = (fs * 0.26) + "px"; } catch(e) {}
    var tx = W * 0.055;
    var ty = hy - mh * 0.52;
    ctx.translate(tx, ty);
    ctx.rotate(-0.035);
    ctx.globalAlpha = 0.86;
    ctx.fillStyle = "#eaf2ff";
    ctx.fillText(word, 0, 0);
    ctx.globalAlpha = 0.22;
    ctx.fillStyle = "#8fc0ff";
    ctx.fillText(word, 0, 1.4);
    ctx.restore();
    ctx.globalAlpha = 1;
  }

  // 米奇：三圆剪影 + 圣诞帽 + 微光
  function drawMickey(x, y, r, time){
    var lit = 0.55 + 0.25 * Math.sin(time * 1.6);
    ctx.save();
    ctx.translate(x, y);
    // 光晕
    var halo = ctx.createRadialGradient(0,0, r*0.2, 0,0, r*2.6);
    halo.addColorStop(0, "rgba(255,206,140," + (0.10 * lit) + ")");
    halo.addColorStop(1, "rgba(255,180,90,0)");
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(0,0, r*2.6, 0, Math.PI*2); ctx.fill();

    // 头 + 耳（暖光实体）
    var earR = r * 0.56;
    var bodyGrad = ctx.createRadialGradient(0, r*0.1, r*0.1, 0, 0, r*1.5);
    bodyGrad.addColorStop(0, "rgba(255,214,150,0.55)");
    bodyGrad.addColorStop(0.55, "rgba(255,168,110,0.34)");
    bodyGrad.addColorStop(1, "rgba(255,140,90,0.18)");
    ctx.fillStyle = bodyGrad;
    ctx.beginPath(); ctx.arc(-r*0.78, -r*0.80, earR, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc( r*0.78, -r*0.80, earR, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI*2); ctx.fill();

    // 金色描边
    ctx.shadowColor = "rgba(255,205,140,.75)";
    ctx.shadowBlur = r * 0.5;
    ctx.strokeStyle = "rgba(255,214,160," + (0.85*lit) + ")";
    ctx.lineWidth = Math.max(1.4, r*0.05);
    ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(-r*0.78,-r*0.80,earR,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc( r*0.78,-r*0.80,earR,0,Math.PI*2); ctx.stroke();
    ctx.shadowBlur = 0;

    // 头里几颗星星
    ctx.fillStyle = "rgba(255,240,210," + (0.5*lit) + ")";
    [[-0.2,-0.1,1.6],[0.25,0.05,1.2],[0.0,0.35,1.4],[-0.1,-0.4,1.1]].forEach(function(st){
      ctx.beginPath(); ctx.arc(st[0]*r, st[1]*r, st[2], 0, Math.PI*2); ctx.fill();
    });

    // 圣诞帽
    ctx.fillStyle = "rgba(196,46,58,.92)";
    ctx.beginPath();
    ctx.moveTo(-r*0.55, -r*0.62);
    ctx.quadraticCurveTo(-r*0.1, -r*1.32, r*0.52, -r*0.74);
    ctx.quadraticCurveTo(0, -r*0.86, -r*0.55, -r*0.62);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(246,250,255,.94)";
    ctx.beginPath();
    ctx.ellipse(-r*0.03, -r*0.72, r*0.55, r*0.13, 0.16, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(r*0.56, -r*0.80, r*0.16, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // 天际线
  function drawSkyline(){
    var y = baseY + 24;
    var seed = 11;
    function rnd(){ seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    var x = W * 0.34;
    while (x < W + 20){
      var w = 14 + rnd()*42;
      var h = 22 + rnd() * (portrait ? 95 : 130);
      ctx.fillStyle = "rgba(8,12,21,.92)";
      ctx.fillRect(x, y - h, w, h + 8);
      ctx.fillStyle = "rgba(255,205,140,.12)";
      for (var wy = y - h + 7; wy < y - 6; wy += 9){
        for (var wx = x + 4; wx < x + w - 4; wx += 6){
          if (rnd() < 0.38) ctx.fillRect(wx, wy, 1.6, 2.6);
        }
      }
      x += w + 3 + (rnd() < 0.3 ? 2 : 0);
    }

    var grd = ctx.createLinearGradient(0, y, 0, H);
    grd.addColorStop(0, "#090e19");
    grd.addColorStop(1, "#03050b");
    ctx.fillStyle = grd; ctx.fillRect(0, y, W, H - y);

    ctx.globalAlpha = 0.3;
    ctx.fillStyle = "#9fb6d8";
    ctx.textAlign = "left";
    ctx.font = "600 " + Math.max(8, Math.min(12, W/100)) + "px -apple-system, sans-serif";
    ctx.fillText("L O S   A N G E L E S", 16, y + 22);
    ctx.globalAlpha = 1;
  }

  function palm(x, baseYY, scale, sway){
    ctx.save();
    ctx.translate(x, baseYY);
    var h = 118 * scale;
    ctx.strokeStyle = "rgba(9,14,19,.95)";
    ctx.lineWidth = 5 * scale;
    ctx.beginPath();
    ctx.moveTo(0,0);
    ctx.quadraticCurveTo(-9*scale, -h*0.5, sway*8*scale, -h);
    ctx.stroke();
    var topX = sway*8*scale, topY = -h;
    for (var i=0;i<7;i++){
      var a = -Math.PI*0.92 + (i/6) * Math.PI * 0.84;
      var len = (32 + ((i*13)%17)) * scale;
      ctx.lineWidth = 4 * scale;
      ctx.beginPath();
      ctx.moveTo(topX, topY);
      ctx.quadraticCurveTo(topX + Math.cos(a)*len*0.6, topY + Math.sin(a)*len*0.6 - 8*scale,
                           topX + Math.cos(a)*len, topY + Math.sin(a)*len*0.72 + 10*scale);
      ctx.stroke();
    }
    ctx.restore();
  }

  function ferris(x, baseYY, scale, lit){
    var R = 44 * scale;
    var cyy = baseYY - R - 24 * scale;
    ctx.save();
    ctx.translate(x, cyy);
    ctx.strokeStyle = "rgba(9,14,22,.95)";
    ctx.lineWidth = 3 * scale;
    ctx.beginPath();
    ctx.moveTo(0, R + 18*scale); ctx.lineTo(-R*0.6, R + 24*scale);
    ctx.moveTo(0, R + 18*scale); ctx.lineTo( R*0.6, R + 24*scale);
    ctx.stroke();
    ctx.strokeStyle = "rgba(11,17,27,.95)";
    ctx.lineWidth = 2.2 * scale;
    ctx.beginPath(); ctx.arc(0,0,R,0,Math.PI*2); ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,R*0.7,0,Math.PI*2); ctx.stroke();
    for (var i=0;i<16;i++){
      var a = i * Math.PI/8;
      ctx.strokeStyle = "rgba(11,17,27,.9)";
      ctx.lineWidth = 1.4 * scale;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(a)*R, Math.sin(a)*R); ctx.stroke();
      var gx = Math.cos(a)*R, gy = Math.sin(a)*R;
      ctx.globalAlpha = 0.85 * lit;
      var sp = 8 * scale;
      ctx.drawImage(SPR.warm, gx - sp, gy - sp, sp*2, sp*2);
      ctx.globalAlpha = 1;
    }
    ctx.fillStyle = "rgba(11,17,27,.95)";
    ctx.beginPath(); ctx.arc(0,0,3.4*scale,0,Math.PI*2); ctx.fill();
    ctx.restore();
  }

  function castle(x, baseYY, scale, lit){
    ctx.save();
    ctx.translate(x, baseYY);
    ctx.fillStyle = "rgba(10,13,24,.95)";
    var u = scale;
    ctx.fillRect(-58*u, -34*u, 116*u, 34*u);
    ctx.fillRect(-44*u, -52*u, 88*u, 20*u);
    ctx.fillRect(-13*u, -104*u, 26*u, 54*u);
    ctx.beginPath();
    ctx.moveTo(-17*u,-104*u); ctx.lineTo(0,-134*u); ctx.lineTo(17*u,-104*u); ctx.closePath(); ctx.fill();
    [-40, 40].forEach(function(dx){
      ctx.fillRect(dx*u - 8*u, -78*u, 16*u, 46*u);
      ctx.beginPath();
      ctx.moveTo(dx*u - 11*u, -78*u);
      ctx.lineTo(dx*u, -100*u);
      ctx.lineTo(dx*u + 11*u, -78*u);
      ctx.closePath(); ctx.fill();
    });
    var g = ctx.createRadialGradient(0,-70*u,2, 0,-70*u, 66*u);
    g.addColorStop(0, "rgba(255,206,140," + (0.7*lit) + ")");
    g.addColorStop(1, "rgba(255,150,80,0)");
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0,-70*u, 66*u, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = "rgba(255,225,170," + (0.7*lit) + ")";
    [[0,-92,3.2],[-16,-64,2.4],[16,-64,2.4],[-40,-56,2.4],[40,-56,2.4]].forEach(function(wk){
      ctx.beginPath(); ctx.arc(wk[0]*u, wk[1]*u, wk[2]*u, 0, Math.PI*2); ctx.fill();
    });
    ctx.restore();
    ctx.globalAlpha = 0.24 * lit;
    ctx.fillStyle = "#9fb6d8";
    ctx.textAlign = "center";
    ctx.font = "600 " + Math.max(8, Math.min(10, W/130)) + "px -apple-system, sans-serif";
    ctx.fillText("D I S N E Y L A N D", x, baseYY + 16*u);
    ctx.globalAlpha = 1;
  }

  /* ---------- 绘制一棵树（含状态动画） ---------- */
  function posFor(pf, it, delayBase, now){
    if (phase === "gather"){
      var delay = (1 - it.t) * delayBase;
      var pr = Math.min(1, Math.max(0, (now - phaseT0 - delay) / gatherDur));
      if (pr <= 0) return null;
      var e = easeOutCubic(pr);
      var startY = pf.y - H * 0.95;
      return {
        x: pf.x + Math.sin(pr * Math.PI * 1.2 + it.ph) * 16 * (1 - pr),
        y: startY + (pf.y - startY) * e,
        a: 0.25 + 0.75 * pr,
        fresh: pr < 0.999
      };
    }
    if (heartProg > 0 && it.hx !== undefined){
      var e = easeInOut(heartProg);
      var pulse = heartProg >= 0.999 ? 1 + 0.035 * Math.sin(timeNow * 3.2) : 1;
      return {
        x: pf.x + (it.hx - pf.x) * e + (it.hx - heartCX) * (pulse - 1),
        y: pf.y + (it.hy - pf.y) * e + (it.hy - heartCY) * (pulse - 1),
        a: 1,
        fresh: false,
        hp: heartProg,
        hd: Math.min(1, Math.sqrt(
          Math.pow(it.hx - heartCX, 2) + Math.pow(it.hy - heartCY, 2)
        ) / (heartUnit * 17))
      };
    }
    return {x: pf.x, y: pf.y, a: 1, fresh: false};
  }

  function drawTreeBody(){
    ctx.save();
    ctx.globalCompositeOperation = "source-over";
    var g = ctx.createRadialGradient(cx, apexY + treeH * 0.55, baseR * 0.1, cx, apexY + treeH * 0.55, baseR * 1.25);
    g.addColorStop(0, "rgba(10,64,42,0.55)");
    g.addColorStop(0.55, "rgba(8,52,34,0.42)");
    g.addColorStop(1, "rgba(6,38,26,0.18)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(cx, apexY);
    ctx.bezierCurveTo(cx + baseR * 0.42, apexY + treeH * 0.42,
                      cx + baseR * 0.94, apexY + treeH * 0.82,
                      cx + baseR, baseY);
    ctx.lineTo(cx - baseR, baseY);
    ctx.bezierCurveTo(cx - baseR * 0.94, apexY + treeH * 0.82,
                      cx - baseR * 0.42, apexY + treeH * 0.42,
                      cx, apexY);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawTree(now, time){
    treeRot = spinAngle;

    if (heartProg > 0.03 && heartUnit > 2){
      var pa = heartProg;
      // 实心心形底
      ctx.beginPath();
      for (var hu=0; hu<=64; hu++){
        var hpt = heartPoint(hu / 64);
        var hx2 = heartCX + hpt[0] * heartUnit * 1.02;
        var hy2 = heartCY + hpt[1] * heartUnit * 1.02;
        if (hu === 0) ctx.moveTo(hx2, hy2); else ctx.lineTo(hx2, hy2);
      }
      ctx.closePath();
      var hfill = ctx.createRadialGradient(heartCX, heartCY - heartUnit*4, heartUnit*2,
                                           heartCX, heartCY, heartUnit*19);
      hfill.addColorStop(0, "rgba(208,18,58," + (0.72 * pa) + ")");
      hfill.addColorStop(0.62, "rgba(196,22,64," + (0.5 * pa) + ")");
      hfill.addColorStop(1, "rgba(180,24,70," + (0.26 * pa) + ")");
      ctx.fillStyle = hfill;
      ctx.fill();

      var hg2 = ctx.createRadialGradient(heartCX, heartCY, heartUnit * 3,
                                        heartCX, heartCY, heartUnit * 22);
      hg2.addColorStop(0, "rgba(96,4,38," + (0.34 * pa) + ")");
      hg2.addColorStop(0.5, "rgba(120,6,46," + (0.20 * pa) + ")");
      hg2.addColorStop(1, "rgba(120,6,46,0)");
      ctx.fillStyle = hg2;
      ctx.beginPath(); ctx.arc(heartCX, heartCY, heartUnit * 22, 0, Math.PI*2); ctx.fill();
    }

    // ---- 针叶（先画背面，再画正面，得到遮挡感） ----
    ctx.globalCompositeOperation = "source-over";
    for (var pass = 0; pass < 2; pass++){
      for (var i=0;i<foliage.length;i++){
        var p = foliage[i];
        var pf = project(p);
        if (pass === 0 ? pf.d >= 0 : pf.d < 0) continue;
        var q = posFor(pf, p, 1050, now);
        if (!q) continue;

        if (q.fresh){
          ctx.globalAlpha = 0.2 * q.a;
          ctx.strokeStyle = "rgba(255,225,240,0.55)";
          ctx.lineWidth = 1;
          ctx.beginPath(); ctx.moveTo(q.x, q.y - 15); ctx.lineTo(q.x, q.y); ctx.stroke();
        }
        var lit = 0.55 + 0.45 * ((pf.d + 1) / 2);
        ctx.globalAlpha = q.a * (0.84 + 0.16 * lit);
        var hp = q.hp || 0;
        if (hp > 0.02){
          var hd = q.hd || 0;
          var hr = Math.round(206 - 6 * hd), hg = Math.round(16 + 74 * hd), hb = Math.round(52 + 86 * hd);
          var mixA = hp;
          var baseC = p.red
            ? [Math.round(TH.red[0] * 0.9), Math.round(TH.red[1] * 0.9), Math.round(TH.red[2] * 0.9)]
            : [Math.round(TH.leaf[0] + (TH.leafHi[0]-TH.leaf[0]) * lit),
               Math.round(TH.leaf[1] + (TH.leafHi[1]-TH.leaf[1]) * lit),
               Math.round(TH.leaf[2] + (TH.leafHi[2]-TH.leaf[2]) * lit)];
          ctx.fillStyle = "rgb(" +
            Math.round(baseC[0] * (1 - mixA) + hr * mixA) + "," +
            Math.round(baseC[1] * (1 - mixA) + hg * mixA) + "," +
            Math.round(baseC[2] * (1 - mixA) + hb * mixA) + ")";
          ctx.globalAlpha = (0.86 + 0.14 * (1 - hd)) * q.a;
        } else if (p.snow){
          ctx.fillStyle = "rgba(255,246,250," + (0.55 * q.a) + ")";
        } else if (p.red){
          ctx.fillStyle = "rgb(" +
            Math.round(TH.red[0] * (0.82 + 0.18*lit) + TH.redHi[0] * 0.18*lit) + "," +
            Math.round(TH.red[1] * (0.82 + 0.18*lit) + TH.redHi[1] * 0.18*lit) + "," +
            Math.round(TH.red[2] * (0.82 + 0.18*lit) + TH.redHi[2] * 0.18*lit) + ")";
        } else {
          ctx.fillStyle = "rgb(" +
            Math.round(TH.leaf[0] * (0.72 + 0.28*lit) + TH.leafHi[0] * 0.22*lit) + "," +
            Math.round(TH.leaf[1] * (0.72 + 0.28*lit) + TH.leafHi[1] * 0.22*lit) + "," +
            Math.round(TH.leaf[2] * (0.72 + 0.28*lit) + TH.leafHi[2] * 0.22*lit) + ")";
        }
        var sz = p.s * pf.sc;
        ctx.beginPath(); ctx.arc(q.x, q.y, sz, 0, Math.PI*2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    // ---- 顶星（黄色五角星） ----
    var pulse = 0.5 + 0.5 * Math.sin(time * 2.0);
    var starR = Math.max(12, Math.min(32, baseR * 0.13));
    var starA = phase === "gather"
      ? Math.min(1, Math.max(0, (now - phaseT0) / 600))
      : 1;
    starA *= (1 - heartProg);
    if (starA > 0){
      var tipY = apexY - starR * 0.55;
      ctx.save();
      ctx.globalAlpha = starA;
      var sg = ctx.createRadialGradient(cx, tipY, 0, cx, tipY, starR * 3.1);
      sg.addColorStop(0, "rgba(255,252,235,.95)");
      sg.addColorStop(0.28, "rgba(" + TH.starGlow + ",.55)");
      sg.addColorStop(1, "rgba(" + TH.starGlow + ",0)");
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.arc(cx, tipY, starR*3.1, 0, Math.PI*2); ctx.fill();
      ctx.restore();
      drawStar5(cx, tipY, starR * (1.05 + 0.1*pulse), time * 0.35, starA, TH.starTop);
      ctx.globalAlpha = 1;
    }

    // ---- 灯泡 ----
    ctx.globalCompositeOperation = "lighter";
    for (var j=0;j<lights.length;j++){
      var l = lights[j];
      var pl = project(l);
      var ql = posFor(pl, l, 1000, now);
      if (!ql) continue;
      var tw = 0.55 + 0.45 * Math.sin(time * l.sp + l.ph);
      var sp = (heartProg > 0.35) ? SPR.red : (SPR[l.kind] || SPR.gold);
      var size = l.rd * 1.95 * pl.sc * (1 + 0.12 * tw);
      ctx.globalAlpha = ql.a * (0.40 + 0.34 * tw) * (0.7 + 0.3 * ((pl.d + 1) / 2));
      ctx.drawImage(sp, ql.x - size, ql.y - size, size*2, size*2);
    }

    // ---- 红色螺旋彩带 ----
    for (var k=0;k<strand.length;k++){
      var q2 = strand[k];
      var p2 = project(q2);
      var qp = posFor(p2, q2, 1000, now);
      if (!qp) continue;
      var stw = 0.5 + 0.5 * Math.sin(time * q2.sp + q2.ph);
      var ssize = q2.rd * 2.1 * p2.sc * (0.8 + 0.4 * stw);
      ctx.globalAlpha = qp.a * (0.3 + 0.4 * stw) * (0.7 + 0.3 * ((p2.d + 1) / 2));
      ctx.drawImage(SPR.red, qp.x - ssize, qp.y - ssize, ssize*2, ssize*2);
    }

    // ---- 黄色小星星挂饰 ----
    for (var m=0;m<starOrn.length;m++){
      var o = starOrn[m];
      var po = project(o);
      var qo = posFor(po, o, 1000, now);
      if (!qo) continue;
      var tw2 = 0.5 + 0.5 * Math.sin(time * o.sp + o.ph);
      var r2 = o.rd * po.sc * (0.85 + 0.3 * tw2);
      ctx.globalAlpha = 0.55 + 0.45 * tw2;
      drawStar5(qo.x, qo.y, r2 * 1.9, time * 0.5 + o.ph, 1, TH.starOrn);
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";

    // ---- 绽放光环 ----
    if (heartProg > 0.5){
      var glowA = (heartProg - 0.5) / 0.5;
      ctx.globalCompositeOperation = "lighter";
      var rg = ctx.createRadialGradient(heartCX, heartCY, heartUnit * 2,
                                        heartCX, heartCY, heartUnit * 24);
      rg.addColorStop(0, "rgba(255,90,130," + (0.16 * glowA) + ")");
      rg.addColorStop(0.55, "rgba(255,60,110," + (0.10 * glowA) + ")");
      rg.addColorStop(1, "rgba(255,40,90,0)");
      ctx.fillStyle = rg;
      ctx.beginPath(); ctx.arc(heartCX, heartCY, heartUnit * 24, 0, Math.PI*2); ctx.fill();
      ctx.globalCompositeOperation = "source-over";
    }
  }

  /* ---------- 雪 ---------- */
  var snowflakes = [];
  function buildSnow(){
    snowflakes.length = 0;
    var n = Math.round(Math.min(240, Math.max(90, W * H / 9000)));
    for (var i=0;i<n;i++){
      snowflakes.push({
        x: Math.random() * W,
        y: Math.random() * H,
        r: 0.7 + Math.random() * 1.9,
        vy: 22 + Math.random() * 62,
        vx: -14 + Math.random() * 28,
        ph: Math.random() * Math.PI * 2,
        sw: 0.6 + Math.random() * 1.4,
        a: 0.35 + Math.random() * 0.55
      });
    }
  }
  function drawSnow(dt, time){
    ctx.globalCompositeOperation = "source-over";
    for (var i=0;i<snowflakes.length;i++){
      var f = snowflakes[i];
      f.y += f.vy * dt;
      f.x += (f.vx + Math.sin(time * f.sw + f.ph) * 12) * dt;
      if (f.y > H + 6){ f.y = -8; f.x = Math.random() * W; }
      if (f.x < -8) f.x = W + 8; else if (f.x > W + 8) f.x = -8;
      ctx.globalAlpha = f.a;
      ctx.fillStyle = TH.snow;
      ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  /* ---------- 主循环 ---------- */
  var t0 = 0;
  var lastTs = 0;
  function frame(ts){
    if (!t0) t0 = ts;
    var time = (ts - t0) / 1000;
    timeNow = time;
    var dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
    lastTs = ts;
    spinVel *= 0.92;
    if (Math.abs(spinVel) < 0.05) spinVel = 0;
    spinAngle += (TREE_SPIN + spinVel) * dt;

    updateHeart(dt);
    if (phase === "gather" && ts - phaseT0 > gatherDur + 1150){
      phase = "idle";
    }

    drawSky(time);
    drawSnow(dt, time);
    drawHills();
    drawSkyline();

    var groundY = baseY + 24;
    var sc = Math.min(1.5, Math.max(0.9, W / 1000));
    palm(W * 0.345, groundY + 10, sc * 0.85, Math.sin(time*0.5) * 0.4);
    palm(W * 0.955, groundY + 12, sc * 0.8, Math.sin(time*0.5 + 1.2) * 0.4);
    ferris(W * 0.44, groundY, sc * (portrait ? 0.75 : 0.9), 1);
    castle(W * 0.79, groundY + 2, sc * (portrait ? 0.58 : 0.8), 1);

    // 米奇
    drawMickey(W * (portrait ? 0.80 : 0.855), H * (portrait ? 0.16 : 0.19),
               Math.min(W, H) * (portrait ? 0.055 : 0.048), time);

    // 地面反光
    var refl = ctx.createRadialGradient(cx, baseY + 10, 4, cx, baseY + 10, baseR * 2.1);
    refl.addColorStop(0, "rgba(" + TH.refl + ",.20)");
    refl.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = refl;
    ctx.beginPath(); ctx.ellipse(cx, baseY + 10, baseR * 2.1, baseR * 0.5, 0, 0, Math.PI*2); ctx.fill();

    // 树光晕
    var halo = ctx.createRadialGradient(cx, (apexY+baseY)/2, 8, cx, (apexY+baseY)/2, baseR*1.65);
    halo.addColorStop(0, "rgba(" + TH.halo + ",.20)");
    halo.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = halo; ctx.fillRect(0,0,W,H);

    drawTree(ts, time);

    // 烟花
    ctx.globalCompositeOperation = "lighter";
    for (var si=sparks.length-1; si>=0; si--){
      var sk = sparks[si];
      sk.x += sk.vx * 0.016;
      sk.y += sk.vy * 0.016;
      sk.vy += 42 * 0.016;
      sk.vx *= 0.986; sk.vy *= 0.986;
      sk.life -= sk.decay * 0.016;
      if (sk.life <= 0){ sparks.splice(si,1); continue; }
      ctx.fillStyle = "rgba(" + sk.col[0] + "," + sk.col[1] + "," + sk.col[2] + "," + (sk.life*0.9) + ")";
      ctx.beginPath(); ctx.arc(sk.x, sk.y, sk.size * (0.6 + sk.life*0.8), 0, Math.PI*2); ctx.fill();
    }
    ctx.globalCompositeOperation = "source-over";

    requestAnimationFrame(frame);
  }


  /* ---------- 背景音乐（Web Audio 现场合成，无外部音频文件） ---------- */
  /* 想换成自己的音频：把 AUDIO_SRC 填成同目录下的文件名或 URL，如 "last-christmas.mp3" */
  var AUDIO_SRC = "";               // 手动写死：如 "last-christmas.mp3"
  var AUDIO_CANDIDATES = ["last-christmas.mp3","last-christmas.m4a","last-christmas.wav","last-christmas.ogg","bgm.mp3","music.mp3"];
  var Music = (function(){
    var ctxA = null, master = null, bellBus = null, padBus = null, noiseBuf = null;
    var playing = false, timer = null, nextTime = 0, step = 0, tempo = 92;
    var userOff = false;

    // Jingle Bells 主旋律（公有领域），每拍一个音，0 表示空
    var MELODY = [
      "E4","E4","E4","0","E4","E4","E4","0","E4","G4","C4","D4","E4","0","0","0",
      "F4","F4","F4","F4","F4","E4","E4","E4","E4","D4","D4","E4","D4","0","G4","0",
      "E4","E4","E4","0","E4","E4","E4","0","E4","G4","C4","D4","E4","0","0","0",
      "F4","F4","F4","F4","F4","E4","E4","E4","G4","G4","F4","D4","C4","0","0","0"
    ];
    var CHORDS = [
      ["C3","E4","G4"], ["C3","E4","G4"], ["C3","E4","G4"], ["G2","B3","D4"],
      ["C3","F3","A3"], ["C3","F3","A3"], ["G2","B3","D4"], ["G2","B3","D4"],
      ["C3","E4","G4"], ["C3","E4","G4"], ["C3","E4","G4"], ["G2","B3","D4"],
      ["C3","F3","A3"], ["C3","F3","A3"], ["G2","B3","D4"], ["C3","E4","G4"]
    ];
    var SEMI = {C:0,"C#":1,D:2,"D#":3,E:4,F:5,"F#":6,G:7,"G#":8,A:9,"A#":10,B:11};
    function freq(n){
      var m = /^([A-G]#?)(-?\d)$/.exec(n);
      if (!m) return 0;
      var midi = SEMI[m[1]] + (+m[2] + 1) * 12;
      return 440 * Math.pow(2, (midi - 69) / 12);
    }

    function makeNoise(){
      var len = ctxA.sampleRate * 0.25;
      var buf = ctxA.createBuffer(1, len, ctxA.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.4);
      return buf;
    }

    function bell(t, f, gain){
      var o1 = ctxA.createOscillator(), o2 = ctxA.createOscillator(), g = ctxA.createGain();
      o1.type = "triangle"; o1.frequency.value = f;
      o2.type = "sine"; o2.frequency.value = f * 2.01;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(gain, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.85);
      o1.connect(g); o2.connect(g);
      var o2g = ctxA.createGain(); o2g.gain.value = 0.28; o2.disconnect(); o2.connect(o2g); o2g.connect(g);
      g.connect(bellBus);
      o1.start(t); o2.start(t); o1.stop(t + 0.9); o2.stop(t + 0.9);
    }

    function pad(t, notes, dur){
      notes.forEach(function(n){
        var o = ctxA.createOscillator(), g = ctxA.createGain();
        o.type = "sine"; o.frequency.value = freq(n);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.035, t + 0.18);
        g.gain.linearRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(padBus);
        o.start(t); o.stop(t + dur + 0.05);
      });
    }

    function sleigh(t, gain){
      var src = ctxA.createBufferSource(); src.buffer = noiseBuf;
      var bp = ctxA.createBiquadFilter(); bp.type = "bandpass";
      bp.frequency.value = 5200; bp.Q.value = 1.4;
      var g = ctxA.createGain();
      g.gain.setValueAtTime(gain, t);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      src.connect(bp); bp.connect(g); g.connect(bellBus);
      src.start(t);
    }

    function schedule(){
      var beat = 60 / tempo;
      while (nextTime < ctxA.currentTime + 0.18){
        var idx = step % 64;
        var m = MELODY[idx];
        if (m) bell(nextTime, freq(m), 0.14);
        if (idx % 4 === 0) pad(nextTime, CHORDS[Math.floor(idx / 4) % 16], beat * 4);
        sleigh(nextTime, idx % 4 === 0 ? 0.16 : 0.07);
        if (idx % 8 === 0) bell(nextTime, freq("C6"), 0.05);
        nextTime += beat;
        step++;
      }
    }

    var detectedSrc = "";
    function probe(cb){
      if (AUDIO_SRC){ cb(AUDIO_SRC); return; }
      var i = 0;
      (function next(){
        if (i >= AUDIO_CANDIDATES.length){ cb(""); return; }
        var url = AUDIO_CANDIDATES[i++];
        fetch(url, {method:"HEAD"}).then(function(r){
          if (r && r.ok){ cb(url); } else { next(); }
        }).catch(function(){ next(); });
      })();
    }

    var extAudio = null, extTimer = null;
    function startExternal(){
      if (!extAudio){
        extAudio = new Audio(AUDIO_SRC);
        extAudio.loop = true; extAudio.volume = 0;
        extAudio.setAttribute("playsinline","");
        extAudio.style.display = "none";
        document.body.appendChild(extAudio);
        extAudio.crossOrigin = "anonymous";
      }
      var p = extAudio.play();
      if (p && p.catch) p.catch(function(){});
      clearInterval(extTimer);
      extTimer = setInterval(function(){
        if (!playing) { clearInterval(extTimer); return; }
        if (extAudio.volume < 0.32) extAudio.volume = Math.min(0.32, extAudio.volume + 0.012);
      }, 60);
    }

    function start(){
      if (playing) return;
      if (!AUDIO_SRC && detectedSrc) AUDIO_SRC = detectedSrc;
      if (AUDIO_SRC){ playing = true; startExternal(); return; }
      if (!ctxA){
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        ctxA = new AC();
        master = ctxA.createGain(); master.gain.value = 0;
        bellBus = ctxA.createGain(); bellBus.gain.value = 1;
        padBus = ctxA.createGain(); padBus.gain.value = 1;
        bellBus.connect(master); padBus.connect(master); master.connect(ctxA.destination);
        noiseBuf = makeNoise();
      }
      if (ctxA.state === "suspended") ctxA.resume();
      nextTime = ctxA.currentTime + 0.08; step = 0;
      playing = true;
      master.gain.cancelScheduledValues(ctxA.currentTime);
      master.gain.setValueAtTime(master.gain.value, ctxA.currentTime);
      master.gain.linearRampToValueAtTime(0.30, ctxA.currentTime + 1.8);
      timer = setInterval(schedule, 40);
    }

    function stop(){
      if (!playing) return;
      playing = false;
      clearInterval(timer); timer = null;
      if (extAudio){
        var a = extAudio; extAudio = null;
        var v = a.volume, step = v / 14;
        var fade = setInterval(function(){
          v -= step;
          if (v <= 0){ a.volume = 0; a.pause(); clearInterval(fade); return; }
          a.volume = v;
        }, 40);
      }
      if (master && ctxA){
        master.gain.cancelScheduledValues(ctxA.currentTime);
        master.gain.setValueAtTime(master.gain.value, ctxA.currentTime);
        master.gain.linearRampToValueAtTime(0.0001, ctxA.currentTime + 0.7);
      }
    }

    return {
      isPlaying: function(){ return playing; },
      probeNow: function(cb){ probe(cb); },
      using: function(){ return AUDIO_SRC || detectedSrc || ""; },
      setSrc: function(v){ if (v) detectedSrc = v; },
      toggle: function(){ playing ? stop() : start(); return playing; },
      auto: function(){ start(); },
      stop: stop
    };
  })();

  /* ---- 音乐按钮 ---- */
  var sndBtn = document.getElementById("snd");
  var sndLabel = document.getElementById("sndLabel");
  var musicWanted = true;
  try { if (localStorage.getItem("christmas_bgm") === "off") musicWanted = false; } catch(e){}
  function syncSnd(){
    var on = musicWanted && (Music.isPlaying() || !everPlayed);
    sndBtn.classList.toggle("on", on);
    sndLabel.textContent = musicWanted ? "Music" : "Muted";
  }
  var everPlayed = false;
  syncSnd();

  /* ---- 配色按钮 ---- */
  var themeBtn = document.getElementById("theme");
  var thSw = document.getElementById("thSw");
  var thLabel = document.getElementById("thLabel");
  function applyTheme(idx){
    themeIdx = ((idx % THEMES.length) + THEMES.length) % THEMES.length;
    TH = THEMES[themeIdx];
    document.body.className = "theme-" + TH.id;
    thSw.style.background = TH.swatch;
    thSw.style.color = TH.swatch;
    thLabel.textContent = TH.label;
    try { localStorage.setItem("christmas_theme", String(themeIdx)); } catch(e){}
  }
  var savedTheme = 0;
  try { var sv = localStorage.getItem("christmas_theme"); if (sv !== null) savedTheme = parseInt(sv, 10) || 0; } catch(e){}
  applyTheme(savedTheme);
  themeBtn.addEventListener("click", function(ev){
    ev.stopPropagation();
    applyTheme(themeIdx + 1);
  });
  Music.probeNow(function(src){
    if (src){
      Music.setSrc(src);
      sndBtn.setAttribute("data-src", src);
      sndBtn.title = "当前音源：" + src;
    }
  });
  sndBtn.addEventListener("click", function(ev){
    ev.stopPropagation();
    if (!musicWanted){ musicWanted = true; }
    else if (Music.isPlaying()){ musicWanted = false; Music.stop(); }
    else { Music.auto(); }
    if (musicWanted && Music.isPlaying()) everPlayed = true;
    try { localStorage.setItem("christmas_bgm", musicWanted ? "on" : "off"); } catch(e){}
    syncSnd();
  });

  var firstGesture = true;
  var drag = { down:false, sx:0, sy:0, lx:0, ly:0, moved:false, t0:0, vx:0 };
  function isBtn(t){ return t && t.closest && (t.closest("#snd") || t.closest("#theme")); }

  window.addEventListener("pointerdown", function(ev){
    if (isBtn(ev.target)) return;
    if (firstGesture){ firstGesture = false; if (musicWanted){ Music.auto(); everPlayed = true; } syncSnd(); }
    drag.down = true; drag.moved = false;
    drag.sx = drag.lx = ev.clientX;
    drag.sy = drag.ly = ev.clientY;
    drag.t0 = performance.now(); drag.vx = 0;
  }, true);

  window.addEventListener("pointermove", function(ev){
    if (!drag.down) return;
    var dx = ev.clientX - drag.lx, dy = ev.clientY - drag.ly;
    drag.lx = ev.clientX; drag.ly = ev.clientY;
    if (!drag.moved && Math.abs(ev.clientX - drag.sx) + Math.abs(ev.clientY - drag.sy) > 6) drag.moved = true;
    if (!drag.moved) return;
    spinAngle -= dx * 0.0062;
    spinVel = -dx * 0.09;                 // 松手后的惯性
    pitch = Math.max(-0.16, Math.min(0.62, pitch + dy * 0.0032));
  }, true);

  window.addEventListener("pointerup", function(ev){
    if (!drag.down) return;
    drag.down = false;
    var quick = performance.now() - drag.t0 < 480;
    if (!drag.moved && quick){
      if (phase === "heart") backToTree();
      else if (phase === "idle") toHeart(performance.now());
    }
  }, true);
  window.addEventListener("pointercancel", function(){ drag.down = false; });
  window.addEventListener("resize", layout);
  window.addEventListener("orientationchange", function(){ setTimeout(layout, 180); });

  layout();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
